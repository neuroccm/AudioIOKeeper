name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, lint
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint

      - name: Verify generated project is up to date
        run: |
          xcodegen generate
          git diff --exit-code -- AudioIOKeeper.xcodeproj \
            || { echo "::error::AudioIOKeeper.xcodeproj is stale. Run 'xcodegen generate' and commit the result."; exit 1; }

      - name: SwiftLint
        run: swiftlint --strict

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project AudioIOKeeper.xcodeproj \
            -scheme AudioIOKeeper \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
