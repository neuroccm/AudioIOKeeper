name: AudioIOKeeper
options:
  bundleIdPrefix: com.neuroccm
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  AudioIOKeeper:
    type: application
    platform: macOS
    sources:
      - path: AudioIOKeeper
    info:
      path: AudioIOKeeper/Info.plist
      properties:
        CFBundleDisplayName: Audio IO Keeper
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 Audio IO Keeper contributors. MIT License."
    entitlements:
      path: AudioIOKeeper/AudioIOKeeper.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neuroccm.AudioIOKeeper
        PRODUCT_NAME: AudioIOKeeper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
  AudioIOKeeperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AudioIOKeeperTests
    dependencies:
      - target: AudioIOKeeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neuroccm.AudioIOKeeperTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AudioIOKeeper:
    build:
      targets:
        AudioIOKeeper: all
        AudioIOKeeperTests: [test]
    test:
      targets:
        - AudioIOKeeperTests
    run:
      config: Debug
