# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration — every pull request to this repository gets an
# automatic review. Docs: https://docs.coderabbit.ai/reference/configuration
language: "en-US"
tone_instructions: >-
  Be direct and specific. This is a small, safety-sensitive macOS utility:
  prioritize correctness of the Core Audio keeper logic, concurrency safety,
  and anything that could make the app fight the user or destabilize the
  system over style trivia.
early_access: false
enable_free_tier: true
reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  auto_title_placeholder: "@coderabbitai"
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  in_progress_fortune: false
  abort_on_close: true
  disable_cache: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords: []
    labels: []
    drafts: false
    base_branches: []
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
  pre_merge_checks:
    docstrings:
      mode: "warning"
      threshold: 80
    title:
      mode: "warning"
      requirements: >-
        The PR title must clearly state what changed, e.g.
        "Restore output pin after aggregate device changes".
    description:
      mode: "warning"
    issue_assessment:
      mode: "warning"
  tools:
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 900000
knowledge_base:
  opt_out: false
  learnings:
    scope:
      auto: true
  issues:
    scope:
      auto: true
  jira:
    usage: "auto"
  linear:
    usage: "auto"
  pull_requests:
    scope:
      auto: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"
      - "README.md"
      - ".github/**/*.md"
chat:
  auto_reply: true
path_instructions:
  - path: "AudioIOKeeper/AudioHardwareClient.swift"
    instructions: >-
      This is the only file allowed to call Core Audio C APIs. Scrutinize
      pointer/buffer handling, OSStatus checks, listener lifetime, and
      thread-safety especially hard. Flag any new Core Audio usage appearing
      in other files.
  - path: "AudioIOKeeper/KeeperEngine.swift"
    instructions: >-
      Pure decision logic. It must stay free of Core Audio, I/O, and global
      state. Any behavior change here requires matching unit tests.
  - path: "AudioIOKeeperTests/**"
    instructions: >-
      Tests must assert the required user-visible behavior (automatic
      switches reverted, in-app choices never fought, disconnected pins
      waited for), not mirror implementation details.
